# Builds the web game in game/ and the Godot port in godot/, and publishes both to GitHub Pages.
# The web game is at the site root; the Godot build is at /godot/ until it replaces it.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['game/**', 'godot/**', '.game-toolkit/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-tools
            ~/.cache/android-sdk
            ~/.local/share/godot/export_templates
          key: godot-4.6.2-${{ hashFiles('godot/tools/setup_godot.py') }}
      - name: Install Godot 4.6.2 and the web export templates
        run: python3 godot/tools/setup_godot.py
      - name: Import the project
        run: ~/.cache/godot-tools/godot-4.6.2/godot --headless --path godot --import
      - name: Rule tests (every puzzle model, every level)
        run: ~/.cache/godot-tools/godot-4.6.2/godot --headless --path godot --script res://tests/test_models.gd
      - name: Check the asset manifest
        run: node .game-toolkit/scripts/validate-manifest.mjs --repo . --manifest godot/asset-manifest.json
      - name: Export the web build
        run: |
          mkdir -p godot/build/web
          ~/.cache/godot-tools/godot-4.6.2/godot --headless --path godot --export-release Web build/web/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK pieces and the debug key
        run: python3 godot/tools/setup_android.py
      - name: Export the Android APK (served next to the web build for sideloading)
        run: |
          mkdir -p godot/build/android
          ~/.cache/godot-tools/godot-4.6.2/godot --headless --path godot --export-debug Android build/android/last-check-in.apk
          cp godot/build/android/last-check-in.apk godot/build/web/last-check-in.apk
      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/build/web
          retention-days: 7

  build:
    needs: godot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Solver and asset tests
        run: npm test
      - name: Build the installable web app
        run: npm run build
      - name: Add the Godot build under /godot/
        uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: game/dist/godot
      - name: Point the site root at the Godot build
        # The web build is frozen; the root now forwards to /godot/ and retires the old service worker.
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>The Last Check-In</title>
          <meta http-equiv="refresh" content="0; url=./godot/">
          <style>body{background:#0b1520;color:#e9e4d8;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0}a{color:#e8b877}</style>
          <script>
          if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (!r.scope.includes('/godot/')) r.unregister(); }));
          location.replace('./godot/');
          </script></head>
          <body><p>Opening <a href="./godot/">The Last Check-In</a>…</p></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
