const LEVELS=[
L(0,'Restore the Terminal','reception','circuit','Rotate the connectors to carry backup power from the battery to the reception terminal.',[
'NARRATOR|11:43 PM. Rain lashes the windows of the Mariner Motel. Nina’s shift should have ended ten minutes ago.',
'NARRATOR|Her handbag, phone, and car keys are behind the empty reception desk. The office telephone rings.',
'OWEN · PHONE|You’re late. Nina’s gone home. Just lock up the desk.',
'YOU|Her car’s still outside.',
'OWEN · PHONE|She got a lift. I’ll explain tomorrow.',
'NARRATOR|He hangs up. Beneath the keyboard is a folded note: “Room 17 checked out at 11:18. That’s impossible. Check the cameras.”',
'YOU|The terminal’s dead. Maybe the backup panel still works.'
],[
'NARRATOR|Power runs through the circuit. The reception monitor flickers awake.',
'TERMINAL|ROOM 17 — CHECKED OUT 11:18 PM — AUTHORISED: NINA S.',
'YOU|Her own account? Why leave a warning about a checkout she approved?'
],'The impossible checkout','Room 17 was checked out at 11:18 PM using Nina’s account, despite her handwritten warning.',{route:'A',hint:['Every live connector must join the next one. Start at the battery on the left.','Follow the five active tiles: across, up, right, down, and out.']}),
L(0,'The Night Register','reception','sort','Arrange the physical receipts from earliest to latest to reveal the inconsistent entry.',[
'NARRATOR|A yellow alert flashes: REGISTER DOES NOT MATCH PHYSICAL RECEIPTS.',
'YOU|Nina always filed these in order. Someone’s moved them.',
'NARRATOR|Four receipts have been pulled from the register and stuffed beneath the cash drawer.'
],[
'YOU|The checkout receipt has Nina’s login, but no signed departure slip.',
'NARRATOR|A guest knocks on the reception glass. A woman in a raincoat waits under the awning.',
'CLAIRE|Is Nina working? She told me not to leave until she checked something.',
'YOU|What was she checking?',
'CLAIRE|Rooms that were apparently empty... but weren’t.'
],'The unsigned receipt','The 11:18 PM checkout for Room 17 has no guest signature. A guest in Room 12 confirms Nina was investigating false checkouts.',{items:[['a','10:43 PM · Room 04','Guest checked in'],['b','11:02 PM · Room 12','Cash payment processed'],['c','11:18 PM · Room 17','Unsigned checkout'],['d','11:26 PM · Staff office','Maintenance log printed']],hint:['Sort by the time stamped on each receipt.','The first receipt is Room 04 at 10:43 PM.']}),
L(0,'The Security Cabinet','security','slide','Slide the storage trays to open a path to the cabinet key.',[
'NARRATOR|The security office is unlocked. A recorder stands dark behind a glass-fronted cabinet.',
'YOU|The key’s in the sliding tray. Someone’s jammed it shut.',
'NARRATOR|Shift the trays into their numbered positions to free the lower-right compartment.'
],[
'NARRATOR|The cabinet opens. A removable backup drive is still connected.',
'YOU|Someone pulled the primary recorder, but missed this one.',
'NARRATOR|A torn label on the cabinet reads: “Service access logs — keep for audit.”'
],'Forgotten backup','A removable security backup drive survived even though the main recording system was tampered with.',{tileLabels:['KEY','TRAY','LOCK','CAM','HALL','EXIT','DOOR','LOG'],scramble:13,hint:['Tap a tile beside the empty space to slide it.','Put the numbered trays in order from 1 at top-left to 8 at bottom-centre.']}),
L(0,'The Missing Footage','security','sort','Reconstruct the CCTV log in chronological order.',[
'NARRATOR|Four camera segments survived, but their index is scrambled.',
'YOU|The timestamps should tell me what happened first.',
'NARRATOR|The footage starts with Nina entering the security office and ends with a vehicle moving near the rear gate.'
],[
'NARRATOR|The reconstructed footage plays. At 11:18 someone at reception uses Nina’s still-open terminal.',
'YOU|Nina was in here at 11:12. Whoever checked out Room 17 wasn’t her.',
'NARRATOR|The figure at reception wears a maintenance jacket, face obscured by the camera angle.',
'OWEN · PHONE|Have you been in the security office? Don’t touch the recordings. I’m coming down.'
],'A second person at the desk','The CCTV sequence places Nina in security at 11:12, while a maintenance-jacketed person operates her terminal at 11:18.',{items:[['a','11:12 PM · Corridor','Nina enters security office'],['b','11:18 PM · Reception','Unknown figure at the terminal'],['c','11:26 PM · Service','Staff door opens'],['d','11:34 PM · Rear yard','Grey van moves toward gate']],hint:['All four clips have an embedded time.','The correct order is 11:12, 11:18, 11:26, then 11:34.']}),
L(0,'The Tampered Reader','service','screws','Remove the exposed fasteners in order to open the damaged access reader.',[
'NARRATOR|The service door reader hangs crookedly from its housing.',
'YOU|Someone opened this after it was sealed for maintenance.',
'NARRATOR|A series of overlapping retaining plates protects the memory unit.'
],[
'NARRATOR|The casing falls free. Its display retains the last staff credential.',
'READER|11:26 PM — ACCESS GRANTED — NIGHT SHIFT',
'YOU|That’s the credential name on my card. But I arrived at 11:43.',
'NARRATOR|A distant metallic impact echoes from the service wing.'
],'The impossible access','The service corridor was opened at 11:26 PM using a NIGHT SHIFT credential, 17 minutes before the player arrived.',{bolts:5,hint:['Remove the screws on top of the overlapping plates first.','The bright outermost screw can be removed first; work toward the centre.']}),
L(0,'The Backup Recorder','security','circuit','Reconnect the recorder’s damaged power circuit.',[
'NARRATOR|The backup recorder contains one audio track that never reached the main system.',
'YOU|The cable was deliberately cut. I can bypass it with the spare connectors.',
'NARRATOR|The playback lights are dark; the rain suddenly seems very loud.'
],[
'NARRATOR|A woman’s voice crackles through the speaker. It is Nina.',
'NINA · RECORDING|You weren’t supposed to find it.',
'NARRATOR|A man answers, too faintly to identify. Then a heavy thud. Silence.',
'YOU|Nina didn’t go home. I’m calling the police.',
'NARRATOR|Dispatch takes the report, but flooding has blocked the coastal road. Help is on its way.'
],'Nina’s last recording','A backup audio recording captures Nina confronting an unidentified man before a struggle. Police have been notified.',{route:'B',hint:['Connect the battery to the recorder without leaving a gap.','Trace the powered line around the lower-left tiles, then up to the top row.']}),
L(0,'The Last Image','security','slide','Slide the damaged image fragments back into their correct positions.',[
'NARRATOR|One final still from the rear camera is broken into digital blocks.',
'YOU|I need to see who was in that van.',
'NARRATOR|An outline of the vehicle can be made out between scrambled strips.'
],[
'NARRATOR|The restored image shows a grey van at 11:34 PM. There are two silhouettes in the cabin.',
'YOU|One is driving. The other is slumped in the passenger seat.',
'NARRATOR|The van’s registration ends in 61. The south gate camera is conveniently missing.'
],'Two figures in the van','At 11:34 PM, a grey van with registration ending 61 moved toward the rear gate. Two occupants were visible.',{tileLabels:['VAN','CAB','GLASS','RAIN','SIDE','WHEEL','GATE','PLATE'],scramble:19,hint:['Each tap moves an adjacent fragment into the empty space.','Restore fragments 1–8 in reading order.']}),
L(0,'The Contradiction','security','match','Match each recorded event to the evidence that proves it happened.',[
'NARRATOR|The evidence no longer fits Owen’s story. You pin the most important findings beside the security monitor.',
'YOU|The timing matters. There has to be a connection.',
'NARRATOR|Match each event to its supporting record.'
],[
'NARRATOR|The case timeline updates. The NIGHT SHIFT credential used at 11:26 is assigned to you.',
'YOU|But my card is in my pocket...',
'NARRATOR|The security monitor chimes: ACCESS GRANTED — ROOM 17 — 12:09 AM.',
'YOU|Someone just used my card again.',
'NARRATOR|Outside the security office, the corridor light goes out.']
,'A cloned identity','The NIGHT SHIFT credential is assigned to the player, yet it was used before arrival and again while the player remained in the security office.',{pairs:[['11:18 · False checkout','Unsigned Room 17 receipt'],['11:26 · Staff door','NIGHT SHIFT access log'],['11:34 · Rear vehicle','Van footage, plate ending 61']],hint:['An event pairs with the record that directly documents it.','Match 11:26 to the NIGHT SHIFT access log.']}),
// CHAPTER TWO
L(1,'Through the Door','room','keypad','Enter the four-digit room override Nina encoded in her note.',[
'NARRATOR|12:13 AM. The passage to Room 17 is empty. The guest’s keycard slot is sealed.',
'YOU|Nina underlined two parts of her note: “Room 17” and “11:18”.',
'NARRATOR|A pencilled instruction appears on the back: “Room + checkout minutes”.'

const rect=(x,y,w,h,fill,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${extra}/>`;
const path=(d,fill,stroke='none',width=1)=>`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}"/>`;

function windowArt(x,y,w,h){return rect(x,y,w,h,'#0b1e28','stroke="#74837d" stroke-width="5"')+rect(x+6,y+6,w-12,h-12,'url(#glass)')+path(`M${x+w/2} ${y}v${h}M${x} ${y+h/2}h${w}`,'none','#354d55',5)+Array.from({length:12},(_,i)=>path(`M${x+10+i*(w-20)/12} ${y+9+(i*19)%(h/2)}l-7 42`,'none','#9dbcb8',.7)).join('');}

function header(){const l=current(),ch=l.ch;return `<header class="topbar"><div><div class="eyebrow">CHAPTER ${ch+1} / ${CHAPTERS.length} · LEVEL ${String(game.level+1).padStart(2,'0')} / 28</div><div class="top-title">${clean(l.title)}</div><div class="top-sub">${clean(CHAPTERS[ch].name)}</div></div><div class="actions"><button class="iconbtn" data-act="archive" title="Open evidence board" aria-label="Evidence board">▤</button><button class="iconbtn" data-act="menu" title="Pause and settings" aria-label="Pause">☰</button></div></header><div class="progress-track"><div class="progress-fill" style="width:${game.level/LEVELS.length*100+(game.phase==='reveal'?100/LEVELS.length:0)}%"></div></div>`}
function renderDialogue(){const l=current();const isIntro=game.phase==='intro';const lines=isIntro?l.intro:l.reveal;const [speaker,text]=lines[game.line]||['NARRATOR','...'];const chapterFirst=game.level===0||LEVELS[game.level-1]?.ch!==l.ch;const locationLabel={reception:'RECEPTION',security:'SECURITY OFFICE',room:'ROOM SEVENTEEN',service:'SERVICE WING',records:'RECORDS OFFICE',yard:'REAR YARD',laundry:'DISUSED LAUNDRY'}[l.loc]||'MARINER MOTEL';
 return `<div class="screen">${header()}<div class="stage"><div class="story-body"><div class="story-tap" data-act="advance" role="button" tabindex="0" aria-label="Continue story">${chapterFirst&&isIntro&&game.line===0?`<div class="chapterflag">CHAPTER ${l.ch+1}: ${CHAPTERS[l.ch].name}</div>`:''}<div class="levelflag"><span class="smallcaps">${isIntro?'INCOMING CASE NOTE':'EVIDENCE REVEAL'} · ${locationLabel}</span></div>${art(l.loc)}${portrait(speaker,l.ch>1||!isIntro)}${!isIntro?`<div class="discovery"><span class="eyebrow">EVIDENCE ${String(game.level+1).padStart(2,'0')} / RECOVERED</span><h2>${clean(l.clue.title)}</h2><p>${clean(l.clue.text)}</p></div>`:''}<div class="dialogue"><div class="speaker">${clean(speaker)}</div><div class="spoken">${clean(text)}</div><div class="tap">TAP TO CONTINUE · ${game.line+1}/${lines.length} ▸</div></div></div></div><div class="scene-actions"><button class="btn ghost small" data-act="replayScene">↶ Replay text</button><button class="btn ghost small" data-act="fastScene">${isIntro?'Inspect now →':'Continue case →'}</button></div><div class="story-footer">${isIntro?'Inspect the scene. Every puzzle reveals another clue.':'This evidence is stored in your casefile.'}</div></div><div class="foot"><button class="btn fill" data-act="advance">${game.line===lines.length-1?(isIntro?'Investigate →':game.level===LEVELS.length-1?'See the ending →':'Next level →'):'Continue →'}</button></div></div>`}
function renderPuzzle(){const l=current(),p=game.puzzle;let board='';if(l.kind==='circuit')board=renderCircuit(l,p);else if(l.kind==='sort')board=renderSort(l,p);else if(l.kind==='slide')board=renderSlide(l,p);else if(l.kind==='screws')board=renderScrews(l,p);else if(l.kind==='match')board=renderMatch(l,p);else if(l.kind==='keypad')board=renderKeypad(l,p);else if(l.kind==='parking')board=renderParking(l,p);
 const showSkip=game.hints>=2;return `<div class="screen">${header()}<div class="stage"><div class="puzzletop"><div class="eyebrow">INTERACTIVE INVESTIGATION · ${l.kind.toUpperCase()}</div><h1 class="puzzletitle">${clean(l.title)}</h1><div class="puzzledesc">${clean(l.task)}</div></div><div class="puzzleplate object-${l.kind} ${l.kind==='screws'?'metal':l.kind==='sort'?'paper':''}"><div class="object-label"><span>MARINER / ${clean(l.loc).toUpperCase()}</span><span>EXHIBIT ${String(game.level+1).padStart(2,'0')}</span></div>${board}</div>${p.complete?'<div class="solvedlabel">✓ PUZZLE COMPLETE · RECOVERING EVIDENCE</div>':`<div class="feedback" role="status">${clean(toast||p.feedback||'')}</div>`}${game.hints>0?`<div class="hintbox"><strong>HINT ${game.hints}/2</strong><div>${clean((l.hint||[])[game.hints-1]||'Try looking at the clues again.')}</div></div>`:''}<div class="puzzlecontrols" ${p.complete?'style="visibility:hidden"':''}><button class="btn ghost small" data-act="reset">↺ Reset</button><button class="btn secondary small" data-act="hint">${showSkip?'⤷ Skip puzzle':'◇ Hint '+(game.hints?game.hints+'/2':'')}</button></div>${debugState.enabled&&!p.complete?`<div class="devtools"><span>DEV · ${game.level+1} / ${LEVELS.length}${debugState.sandbox?' · SANDBOX':''}</span><button class="btn small ghost" data-act="devPanel">Tools</button><button class="btn small devskip" data-act="debugSkip" aria-label="Developer skip puzzle and award evidence">⏭ Skip puzzle</button></div>`:''}<div style="flex:1;min-height:12px"></div><div class="story-footer">No time limit · No penalties · Your progress saves automatically</div></div></div>`;}
function renderCircuit(l,p){const prefix=circuitPrefix(p);const power=l.title.toLowerCase().includes('boiler')?'VALVE':l.title.toLowerCase().includes('intercom')?'INTERCOM':l.title.toLowerCase().includes('flood')?'PUMP':'TERMINAL';let tiles='';for(let i=0;i<9;i++){if(!(i in p.types)){tiles+=`<div class="circuit-tile off" aria-hidden="true">·</div>`;continue;}let dirs=tileDirs(p.types[i],p.rot[i]);const active=prefix.includes(i);let lines=dirs.map(dir=>{const coords={N:[50,50,50,0],E:[50,50,100,50],S:[50,50,50,100],W:[50,50,0,50]}[dir];return `<line x1="${coords[0]}" y1="${coords[1]}" x2="${coords[2]}" y2="${coords[3]}" stroke="${active?'#a3f1ce':'#b8a77d'}" stroke-width="16" stroke-linecap="round"/>`}).join('');tiles+=`<button class="circuit-tile path ${active?'active':''}" data-act="circuit" data-value="${i}" aria-label="Rotate connector ${i+1}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="17" fill="${active?'#cff5cd':'#d9cba7'}"/>${lines}<circle cx="50" cy="50" r="10" fill="#243942"/></svg></button>`}return `<div class="circuit-layout"><div class="powerend"><span>▣</span>BATTERY</div><div class="circuit-board">${tiles}</div><div class="powerend"><span>▤</span>${power}</div></div><div class="boardtag">ROTATE COPPER CONNECTORS · LINK BATTERY TO OUTPUT</div>`}
function renderSort(l,p){const lookup=Object.fromEntries(l.items.map(x=>[x[0],x]));return `<div class="sort-list">${p.order.map((id,i)=>{const x=lookup[id];return `<button class="sort-item ${p.selected===id?'selected':''}" data-act="sort" data-value="${id}"><span class="idx">${i+1}</span><span><span class="body">${clean(x[1])}</span><span class="sub">${clean(x[2])}</span></span><span style="margin-left:auto">⇅</span></button>`}).join('')}</div><div class="boardtag" style="color:#41515a">DRAG RECORDS INTO ORDER · OR TAP TWO TO SWAP</div>`}
function renderSlide(l,p){return `<div class="tile-board" style="--fragment-image:url('data:image/svg+xml,${encodeURIComponent(art(l.loc).match(/<svg[\s\S]*?<\/svg>/)[0])}')">${p.tiles.map((n,i)=>n===0?'<div class="slide-tile blank" aria-label="Empty space"></div>':`<button style="--fragment-x:${((n-1)%3)*50}%;--fragment-y:${Math.floor((n-1)/3)*50}%" class="slide-tile ${neighbors(p.tiles.indexOf(0)).includes(i)?'canmove':''}" data-act="slide" data-value="${i}" aria-label="Slide fragment ${n}"><span class="number">${n}</span><span class="fragment">${clean(l.tileLabels?.[n-1]||'FRAGMENT')}</span></button>`).join('')}</div><div class="boardtag">RESTORE FRAGMENTS 1–8 · EMPTY SPACE LOWER RIGHT</div>`}
function renderScrews(l,p){const bolts=boltSpecs(l.bolts);const plates=bolts.map((b,i)=>`<div class="metalplate ${p.removed.includes(i)?'gone':''}" style="left:${Math.max(2,b.x-27)}%;top:${Math.max(0,b.y-11)}%;width:53%;--tilt:${i%2===0?'-7deg':'8deg'}"></div>`).join('');const screws=bolts.map((b,i)=>{const removed=p.removed.includes(i),ready=b.deps.every(x=>p.removed.includes(x));return `<button class="bolt ${removed?'removed':ready?'ready':'blocked'}" style="left:${b.x}%;top:${b.y}%" data-act="screw" data-value="${i}" ${removed?'disabled':''} aria-label="${removed?'Removed':'Remove'} screw ${i+1}">⊖</button>`}).join('');return `<div class="screwboard">${plates}${screws}<div class="bolt-caption">FASTENERS REMOVED: ${p.removed.length} / ${l.bolts}</div></div><div class="boardtag">THE BRIGHT SCREWS ARE ACCESSIBLE · REMOVE TOP PLATES FIRST</div>`}
function renderMatch(l,p){const left=l.pairs.map((item,i)=>`<button class="pair-item ${p.matched.includes(i)?'matched':p.selected===i?'selected':''}" data-act="left" data-value="${i}" ${p.matched.includes(i)?'disabled':''}>${p.matched.includes(i)?'✓ ':''}${clean(item[0])}</button>`).join('');const right=p.right.map(i=>`<button class="pair-item ${p.matched.includes(i)?'matched':''}" data-act="right" data-value="${i}" ${p.matched.includes(i)?'disabled':''}>${p.matched.includes(i)?'✓ ':''}${clean(l.pairs[i][1])}</button>`).join('');return `<div class="pair-cols"><div class="pair-col"><div class="pair-head">Record / Event</div>${left}</div><div class="pair-col"><div class="pair-head">Supporting evidence</div>${right}</div></div><div class="boardtag">SELECT ONE ON THE LEFT, THEN ITS MATCH ON THE RIGHT</div>`}
function renderKeypad(l,p){const digits=['1','2','3','4','5','6','7','8','9','DEL','0','CLR'];return `<div class="gate-clue">${clean(l.codeClue)}</div><div class="keydisplay">${(p.entered+'____').slice(0,4).split('').map(x=>x==='_'?'•':x).join(' ')}</div><div class="keygrid">${digits.map(x=>`<button class="key ${x==='DEL'||x==='CLR'?'special':''}" data-act="${x==='DEL'?'delete':x==='CLR'?'clear':'digit'}" data-value="${x}">${x==='DEL'?'⌫':x==='CLR'?'CLEAR':x}</button>`).join('')}</div>`}
function renderParking(l,p){let cars=p.cars.map(c=>`<button class="park-car ${c.target?'target':'other'} ${p.selected===c.id?'selected':''}" data-act="selectcar" data-value="${c.id}" style="left:calc(${c.x*100/6}% + 2px);top:calc(${c.y*100/6}% + 2px);width:calc(${(c.dir==='h'?c.len:1)*100/6}% - 4px);height:calc(${(c.dir==='v'?c.len:1)*100/6}% - 4px)">${c.target?'VAN':c.id}<span class="wheel">${c.dir==='h'?'⇠ ⇢':'⇡ ⇣'}</span></button>`).join('');const selected=p.cars.find(c=>c.id===p.selected);return `<div class="parking-grid">${cars}</div><div class="park-buttons"><button class="btn ghost" data-act="parkmove" data-value="-1">${selected?.dir==='v'?'↑':'←'}</button><button class="btn ghost" data-act="parkmove" data-value="1">${selected?.dir==='v'?'↓':'→'}</button></div><div class="boardtag">SELECT A VEHICLE · SLIDE ALONG ITS OWN LANE<br>DRAG OR USE ARROWS · GOLD VAN TO RIGHT-HAND EXIT</div>`}
function renderEnd(){return `<div class="screen">${art('exterior')}<div class="stage"><div class="end-hero"><div class="eyebrow">CASEFILE COMPLETE · CHAPTER 4 / 4</div><h1>Before Dawn</h1><p class="bigline" style="font-family:Georgia,serif">The truth made it out of the Mariner Motel.</p></div><div class="card" style="margin:0 17px 12px"><div class="eyebrow">EPILOGUE</div><p class="bigline">Nina returned home. Claire finally received the evidence she had been denied for years.</p><p class="bigline">Daniel was taken into custody over the kidnapping and the events of 2019. Owen's involvement in hiding the evidence became part of the police investigation.</p><p class="bigline">The motel reopened months later. The night register was preserved as evidence.</p><p class="note">One missing shift. Twenty-eight puzzles. One truth they could not keep buried.</p></div><div class="credits">THE LAST CHECK-IN<br>AN ORIGINAL OFFLINE PUZZLE THRILLER<br>28 PLAYABLE LEVELS · 4 CHAPTERS<br>THANK YOU FOR PLAYING</div></div><div class="foot"><div class="btnrow"><button class="btn secondary" data-act="archive">View all 28 clues</button><button class="btn" data-act="replay">Play again</button></div></div></div>`}
function renderOverlay(){if(!overlay)return'';if(overlay==='archive'){const clues=game?.clues||[];return `<div class="overlay"><div class="overlay-header"><div><div class="eyebrow">INVESTIGATION ARCHIVE</div><h2>Evidence board</h2></div><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div><div class="scroll"><div class="fine muted" style="padding:12px 0">${clues.length} / 28 clues recovered</div><div class="archive-grid">${clues.length?clues.map(x=>`<div class="archive-item"><div class="eyebrow">CHAPTER ${x.chapter+1} · LEVEL ${x.level+1}</div><h4>${clean(x.title)}</h4><p>${clean(x.text)}</p></div>`).join(''):'<p class="muted">Evidence you uncover will appear here. The story can always be resumed.</p>'}</div></div></div>`}
 if(overlay==='developer'&&debugState.enabled)return developerPanel();
 if(overlay==='pause'){return `<div class="overlay"><div class="overlay-header"><div><div class="eyebrow">INVESTIGATION PAUSED</div><h2>Options</h2></div><button class="iconbtn" data-act="close">✕</button></div><div class="scroll"><div class="card" style="margin-top:18px"><div class="eyebrow">YOUR PROGRESS</div><h3 class="sectionname">${game&&game.level<LEVELS.length?clean(current().title):'Case Closed'}</h3><p class="muted fine">${game?.clues.length||0} clues found. Progress saves automatically on this device.</p></div><div class="btnrow" style="margin-top:18px"><button class="btn ghost" data-act="sound">Sound: ${sound.enabled?'On':'Off'}</button><button class="btn ghost" data-act="archive">Evidence</button></div>${settingsPanel()}<button class="btn secondary fill" style="margin-top:15px" data-act="title">Return to title</button><button class="btn ghost fill" style="margin-top:8px" data-act="confirmnew">Restart from beginning…</button></div><button class="btn fill" data-act="close">Resume game</button></div>`}
 if(overlay==='skip')return modal('Skip this puzzle?','You will still receive the clue and continue the story. There is no penalty.','skipYes','Skip and continue','close','Keep playing');
 if(overlay==='restart')return modal('Start over?','This will replace the saved investigation on this device.','startYes','Start new game','close','Cancel');
 if(overlay==='about')return modal('About The Last Check-In','Original vector illustrations, character portraits, procedural music and sound by the production build. No third-party media. A complete offline-first cinematic puzzle thriller. Contains 28 hand-authored stages across four chapters. No ads, accounts or purchases. Play in portrait on a mobile browser. Saved progress uses this browser’s local storage.','close','Close','close','Return');return''}
function modal(title,body,yesAct,yesLabel,noAct,noLabel){return `<div class="overlay" style="justify-content:center"><div class="card"><h2 class="sectionname">${clean(title)}</h2><p class="muted" style="line-height:1.65">${clean(body)}</p><div class="btnrow" style="margin-top:18px"><button class="btn ghost" data-act="${noAct}">${clean(noLabel)}</button><button class="btn" data-act="${yesAct}">${clean(yesLabel)}</button></div></div></div>`}
function render(){document.documentElement.dataset.motion=preferences.motion?'reduce':'full';document.documentElement.style.setProperty('--text-scale',preferences.text);if(game)audioScene(atEnd()?'exterior':current().loc,atEnd()?4:current().ch,atEnd());toastTimer++;const snap=toastTimer;const focused=document.activeElement?.closest('[data-act]');const focusAct=focused?.dataset.act,focusValue=focused?.dataset.value;if(!game)renderMenu();else if(atEnd())app.innerHTML=renderEnd();else if(game.phase==='puzzle'){if(!game.puzzle)game.puzzle=initPuzzle(current(),game.level);app.innerHTML=renderPuzzle();}else app.innerHTML=renderDialogue();if(overlay){app.insertAdjacentHTML('beforeend',renderOverlay())}if(focusAct){const candidates=app.querySelectorAll('[data-act]');[...candidates].find(x=>x.dataset.act===focusAct&&x.dataset.value===focusValue)?.focus({preventScroll:true});}if(toast){const orig=toast;setTimeout(()=>{if(snap===toastTimer&&toast===orig){toast='';const el=app.querySelector('.feedback');if(el)el.textContent='';}},2500)}}
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,val=el.dataset.value;switch(act){case'devPanel':if(debugState.enabled){overlay='developer';render();}break;case'devJump':if(debugState.enabled){debugState.sandbox=true;game=defaultGame();game.level=Number(document.querySelector('#dev-stage').value);overlay='';beginPuzzle();}break;case'devAdvance':if(debugState.enabled){overlay='';if(game?.phase==='puzzle')skipLevel();else nextDialogue();}break;case'devSound':if(debugState.enabled)sfx(val);break;case'fastScene':if(game&&!atEnd()){game.line=(game.phase==='intro'?current().intro:current().reveal).length-1;nextDialogue();}break;case'replayScene':if(game&&!atEnd()){game.line=0;store();render();}break;case'debugtap':if(++debugState.titleTaps>=7){debugState.enabled=!debugState.enabled;debugState.titleTaps=0;render();}break;case'debugSkip':if(debugState.enabled&&game?.phase==='puzzle'&&!game.puzzle?.complete)skipLevel();break;case'new':overlay='restart';if(!restore())startNew();else render();break;case'continue':startSaved();break;case'about':overlay='about';render();break;case'advance':nextDialogue();break;case'archive':overlay='archive';render();break;case'menu':overlay='pause';render();break;case'close':overlay='';render();break;case'skipYes':skipLevel();break;case'confirmnew':overlay='restart';render();break;case'startYes':startNew();break;case'title':overlay='';game=null;renderMenu();break;case'replay':overlay='restart';render();break;case'sound':sound.enabled=!sound.enabled;preferences.muted=!sound.enabled;savePreferences();mix();if(game){game.sound=sound.enabled;store()}render();break;case'reset':reset();break;case'hint':hintClick();break;case'clear':if(game?.phase==='puzzle'){game.puzzle.entered='';store();render()}break;default:puzzleAction(act,val);}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const f=document.activeElement;if(f?.dataset?.act==='advance'){e.preventDefault();nextDialogue()}}});
render();

function settingsPanel(){return `<div class="settings"><h3>Sound &amp; reading</h3>${['master','music','ambience','effects'].map(n=>`<label>${n[0].toUpperCase()+n.slice(1)} <output id="${n}-value">${Math.round(preferences[n]*100)}%</output><input aria-label="${n} volume" type="range" min="0" max="1" step=".05" data-pref="${n}" value="${preferences[n]}"></label>`).join('')}<label><span>Reduce motion</span><input type="checkbox" data-pref="motion" ${preferences.motion?'checked':''}></label><label>Text size<select data-pref="text" aria-label="Text size"><option value="1" ${preferences.text==1?'selected':''}>Standard</option><option value="1.15" ${preferences.text==1.15?'selected':''}>Large</option><option value="1.3" ${preferences.text==1.3?'selected':''}>Largest</option></select></label><p class="fine muted">Text advances at your pace. Sound starts with your first interaction. Settings are saved on this device.</p></div>`;}
function developerPanel(){return `<div class="overlay" role="dialog" aria-label="Developer tools"><div class="overlay-header"><h2>Developer tools</h2><button class="iconbtn" data-act="close" aria-label="Close tools">×</button></div><div class="scroll"><p>${game?'Stage '+(game.level+1)+' · '+game.phase:'Title'} ${debugState.sandbox?'· isolated sandbox':''}</p><label>Inspect stage<select id="dev-stage">${LEVELS.map((l,i)=>`<option value="${i}" ${game?.level===i?'selected':''}>${i+1}. ${clean(l.title)}</option>`).join('')}</select></label><button class="btn fill" data-act="devJump">Jump in isolated sandbox</button><p class="fine">Stage jumps do not write to the investigation save. Return to title and Continue to restore your saved case.</p><button class="btn secondary fill" data-act="devAdvance">Advance scene / award clue</button><div class="sound-tests">${['phone','paper','metal','static','power','clue','door'].map(n=>`<button class="btn ghost small" data-act="devSound" data-value="${n}">${n}</button>`).join('')}</div><button class="btn secondary fill" data-act="title">Return to title</button></div></div>`;}
app.addEventListener('input',e=>{const n=e.target.dataset.pref;if(!n)return;preferences[n]=e.target.type==='checkbox'?e.target.checked:Number(e.target.value);savePreferences();mix();const out=app.querySelector('#'+n+'-value');if(out)out.textContent=Math.round(preferences[n]*100)+'%';document.documentElement.dataset.motion=preferences.motion?'reduce':'full';document.documentElement.style.setProperty('--text-scale',preferences.text);});
// Pointer gestures use the exact same legal-move actions as the keyboard/tap controls.
let drag=null,suppressClick=false;
app.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-act]');if(!el||!['sort','selectcar','left'].includes(el.dataset.act)||game?.phase!=='puzzle')return;drag={x:e.clientX,y:e.clientY,act:el.dataset.act,value:el.dataset.value,el};});
app.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>9){drag.el.classList.add('dragging');if(drag.act!=='left')drag.el.style.transform=`translate(${drag.act==='selectcar'&&game.puzzle.cars.find(c=>c.id===drag.value).dir==='v'?0:dx}px,${drag.act==='selectcar'&&game.puzzle.cars.find(c=>c.id===drag.value).dir==='h'?0:dy}px)`;}});
app.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;d.el.style.transform='';d.el.classList.remove('dragging');if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<12)return;suppressClick=true;setTimeout(()=>suppressClick=false,0);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-act]');
 if(d.act==='sort'&&target?.dataset.act==='sort'){const p=game.puzzle,a=p.order.indexOf(d.value),b=p.order.indexOf(target.dataset.value);if(a>=0&&b>=0){p.order.splice(b,0,p.order.splice(a,1)[0]);p.selected=null;sfx('paper');if(p.order.every((v,i)=>v===current().items[i][0]))queueWin();else{store();render();}}}
 else if(d.act==='left'&&target?.dataset.act==='right'){puzzleAction('left',d.value);puzzleAction('right',target.dataset.value);}
 else if(d.act==='selectcar'){const c=game.puzzle.cars.find(c=>c.id===d.value);game.puzzle.selected=d.value;const distance=c.dir==='h'?e.clientX-d.x:e.clientY-d.y,cell=app.querySelector('.parking-grid').clientWidth/6,steps=Math.max(1,Math.round(Math.abs(distance)/cell));for(let i=0;i<steps&&game.phase==='puzzle'&&!game.puzzle.complete;i++)puzzleAction('parkmove',String(Math.sign(distance)));}
});
app.addEventListener('pointercancel',()=>{if(drag){drag.el.style.transform='';drag.el.classList.remove('dragging');drag=null;}});
app.addEventListener('click',e=>{if(suppressClick){e.stopImmediatePropagation();e.preventDefault();}},true);
// Trap focus inside open overlays, support Escape and restore a useful focus target.
app.addEventListener('keydown',e=>{const panel=app.querySelector('.overlay');if(!panel)return;if(e.key==='Escape'){overlay='';render();app.querySelector('[data-act="menu"]')?.focus();}if(e.key==='Tab'){const all=[...panel.querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled),i=all.indexOf(document.activeElement);if(i<0||e.shiftKey&&i===0||!e.shiftKey&&i===all.length-1){e.preventDefault();(e.shiftKey?all.at(-1):all[0])?.focus();}}});

</script></body></html>
